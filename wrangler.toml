name = "stability-admin"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 5분마다 실행 — DB에 저장된 알람 설정(hour/minute)과 현재 시각(KST)이
# 일치하고 오늘 아직 실행되지 않은 알람만 골라서 발송합니다.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "stability-admin-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Secrets (코드/저장소에 절대 값 커밋하지 말 것 — wrangler secret put 으로 등록)
#   SESSION_SECRET     세션 토큰 서명용 임의의 긴 문자열
#   TEAMS_WEBHOOK_URL  Power Automate "웹훅 요청을 받으면 채널에 게시" 워크플로 URL
